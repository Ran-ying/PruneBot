<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>登录 · QQ Bot 聊天记录</title>
    <link rel="stylesheet" href="/login.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <p class="eyebrow">QQ BOT</p>
        <h1 id="login-title">聊天记录</h1>
        <p class="subtitle">请输入管理密码以继续访问</p>
        <form id="login-form">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button id="login-button" type="submit">登录</button>
        </form>
      </section>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
