<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>和布伦妮聊聊</title>
    <link rel="stylesheet" href="/demo.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <img class="avatar" src="/brune.png" alt="布伦妮">
        <div>
          <p class="eyebrow">WEB DEMO</p>
          <h1>和布伦妮聊聊</h1>
          <p class="subtitle">认真一点，也自然一点。</p>
        </div>
      </header>
      <section id="messages" class="messages" aria-live="polite" aria-label="聊天内容">
        <article class="message assistant">你好。我是布伦妮，今天想聊点什么？</article>
      </section>
      <p class="notice">这是公开演示版。请勿发送隐私、账号信息或紧急求助内容；每个会话的上下文仅用于继续本次聊天。</p>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">输入消息</label>
        <textarea id="message-input" name="message" rows="1" maxlength="2000" placeholder="发消息给布伦妮…" autocomplete="off" required></textarea>
        <button id="send-button" type="submit">发送</button>
      </form>
    </main>
    <script src="/demo.js" defer></script>
  </body>
</html>
